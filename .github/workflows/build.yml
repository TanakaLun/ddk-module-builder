name: Build Module
run-name: Build ${{ inputs.module_path }} on ${{ inputs.branch }}

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Kernel branch (e.g., android16-6.12, android15-6.6)'
        required: true
        default: 'android12-5.10'
      ddk_version:
        description: 'DDK version (default: 20260313)'
        required: false
        default: '20260313'
      module_path:
        description: 'Module relative path in kernel tree (e.g., net/unix or net/netfilter/ipset)'
        required: true
        default: 'net/netfilter'
      configs:
        description: 'Options pass to scripts/config, e.g., -m CONFIG_UNIX_DIAG or -m CONFIG_IP_SET'
        required: true
        default: '-m CONFIG_IP_SET -m CONFIG_IP_SET_BITMAP_IP -m CONFIG_IP_SET_BITMAP_IPMAC -m CONFIG_IP_SET_BITMAP_PORT -m CONFIG_IP_SET_HASH_IP -m CONFIG_IP_SET_HASH_IPMARK -m CONFIG_IP_SET_HASH_IPPORT -m CONFIG_IP_SET_HASH_IPPORTIP -m CONFIG_IP_SET_HASH_IPPORTNET -m CONFIG_IP_SET_HASH_IPMAC -m CONFIG_IP_SET_HASH_MAC -m CONFIG_IP_SET_HASH_NETPORTNET -m CONFIG_IP_SET_HASH_NET -m CONFIG_IP_SET_HASH_NETNET -m CONFIG_IP_SET_HASH_NETPORT -m CONFIG_IP_SET_HASH_NETIFACE -m CONFIG_IP_SET_LIST_SET --set-val CONFIG_IP_SET_MAX 65534 -m CONFIG_NETFILTER_XT_MATCH_ADDRTYPE -m CONFIG_NETFILTER_XT_SET'

jobs:
  build-ko:
    name: Build module
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ inputs.branch }}-${{ inputs.ddk_version }}
      options: --privileged

    steps:
    - name: Build 
      run: |
        BRANCH=${{ inputs.branch }}
        MODULE_PATH=${{ inputs.module_path }}
        CONFIGS="${{ inputs.configs }}"
        cat <<-EOF > info.txt
        BRANCH=$BRANCH
        MODULE_PATH=$MODULE_PATH
        CONFIGS="$CONFIGS"
        DDK_VERSION=${{ inputs.ddk_version }}
        EOF
        
        SRC=/opt/ddk/src/$BRANCH
        mkdir out
        OUT=$(realpath out)
        make -C $SRC O=$OUT gki_defconfig
        
        # Build config parameters from the input
        CONFIG_ARGS="$CONFIGS"
        
        # Apply CONFIG_CFI_ICALL_NORMALIZE_INTEGERS only for android16-6.12
        if [ "$BRANCH" = "android16-6.12" ]; then
          CONFIG_ARGS="$CONFIG_ARGS -e CONFIG_CFI_ICALL_NORMALIZE_INTEGERS"
        fi
        
        $SRC/scripts/config --file $OUT/.config $CONFIG_ARGS
        make -C $SRC O=$OUT olddefconfig
        make -C $SRC O=$OUT modules_prepare
        make -C $SRC O=$OUT M=$SRC/$MODULE_PATH modules

    - name: Prepare Artifacts
      run: |
        BASE="/opt/ddk/src/${{ inputs.branch }}/${{ inputs.module_path }}"
        mkdir artifacts

        # Move *.ko into workspace while preserving paths
        while IFS= read -r -d '' f; do
          rel="artifacts/${f#"$BASE"/}"
          mkdir -p "$(dirname "$rel")"
          mv "$f" "$rel"
        done < <(find "$BASE" -type f  -name '*.ko' -print0)

        # Move kernel config and rename
        mv out/.config artifacts/kernel_config.txt
        mv info.txt artifacts

    - name: Upload kernel modules and config files
      uses: actions/upload-artifact@v7
      with:
        name: modules
        path: artifacts
